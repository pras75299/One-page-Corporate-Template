# One-Page Corporate Template — Netlify deploy (backend = Express as serverless function)
# Set env in Netlify UI: DATABASE_URL, SESSION_SECRET, ADMIN_PASSWORD (optional)

[build]
  # Copy assets into publish dir so Netlify serves images/CSS/JS from CDN (static files take precedence over function rewrite)
  command = "cp -r assets public/assets"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg", "ejs"]
  # Include app, server, views, assets so the function can require('../../app') and serve views/assets
  included_files = ["./app.js", "./server/**", "./views/**", "./assets/**"]

# Serve /assets/* from publish dir (images, CSS, JS) — must come before catch-all
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

# Send all other traffic to the Express app (DB-driven pages)
[[redirects]]
  force = true
  from = "/*"
  status = 200
  to = "/.netlify/functions/server/:splat"
